# Temporary preview deployment for the Shopify inventory app.
# Note: the free Render filesystem is ephemeral; this is for preview/testing only.
# For durable use, move Prisma sessions/app data to a persistent database before production.
services:
  - type: web
    name: zia-inventory-preview
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_products,read_inventory,read_locations
